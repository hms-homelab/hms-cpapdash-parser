name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2026.1.0)'
        required: true
        default: 'v2026.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            artifact: cpapdash-parser-linux-amd64
          - os: macos-latest
            name: macos-arm64
            artifact: cpapdash-parser-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev libgtest-dev libgmock-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install openssl googletest

      - name: Build & test
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPAPDASH_PARSER_WITH_LOWENSTEIN=ON \
            -DCPAPDASH_PARSER_WITH_PHILIPS=ON \
            -DCPAPDASH_PARSER_BUILD_TESTS=ON
          cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cd build && ctest --output-on-failure

      # Note: C++ static-lib binaries are ABI-sensitive (compiler/stdlib must
      # match the consumer). These artifacts are a convenience; the supported
      # path is CMake FetchContent against the pinned tag (see README).
      - name: Package
        run: |
          mkdir -p dist/lib dist/include
          cp build/libcpapdash_parser.a dist/lib/
          cp -r include/cpapdash dist/include/
          for f in LICENSE README.md CHANGELOG.md; do [ -f "$f" ] && cp "$f" dist/ || true; done
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          ls -lh release/

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: release/*
