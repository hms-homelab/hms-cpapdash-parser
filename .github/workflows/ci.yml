name: CI

# MANUAL ONLY. Do not add a push/pull_request trigger back.
#
# Several repositories now compete for one Actions budget, and this workflow is a
# MATRIX -- it multiplies runner time by the number of configurations, so it is
# the most expensive CI here per push. Reserved for a final confirmation before a
# release.
#
# Build and test locally before pushing:
#     cmake -S . -B build -DCPAPDASH_PARSER_BUILD_TESTS=ON \
#         && cmake --build build -j8 && ctest --test-dir build --output-on-failure
#
# Trigger this one from the Actions UI or:  gh workflow run ci.yml --ref master
#
# The Release workflow is separate and still fires on a v* tag, which is the
# final-deployment case and stays automatic.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libssl-dev libgtest-dev libgmock-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install openssl googletest

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPAPDASH_PARSER_WITH_LOWENSTEIN=ON \
            -DCPAPDASH_PARSER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Test
        run: cd build && ctest --output-on-failure
